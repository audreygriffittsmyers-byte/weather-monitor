<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WATCH — Social Alert Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; max-width: 100vw; }
body { font-family: Arial, sans-serif; background: #0a1628; color: #e0e8f0; min-height: 100vh; }
.header { background: #0E2841; border-bottom: 2px solid #29B6D8; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-title { font-size: 13px; font-weight: 800; color: #fff; letter-spacing: 2px; }
.header-sub { font-size: 10px; color: #29B6D8; letter-spacing: 1px; margin-top: 2px; }
.layout { display: flex; height: calc(100vh - 62px); }
.sidebar { width: 220px; min-width: 220px; background: #0E2841; border-right: 1px solid #1a3a5c; overflow-y: auto; padding: 12px; }
.sidebar h3 { font-size: 9px; font-weight: 800; letter-spacing: 2px; color: #29B6D8; text-transform: uppercase; margin: 14px 0 8px; }
.sidebar h3:first-child { margin-top: 0; }
.template-btn { width: 100%; text-align: left; padding: 8px 10px; border-radius: 5px; border: 1px solid transparent; background: rgba(255,255,255,0.04); color: #c0cfe0; cursor: pointer; margin-bottom: 3px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: all 0.15s; }
.template-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.template-btn.active { border-color: var(--accent); background: rgba(255,255,255,0.1); color: #fff; }
.template-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--accent); }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { background: #0E2841; border-bottom: 1px solid #1a3a5c; padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar label { font-size: 9px; font-weight: 700; color: #7a9ab8; letter-spacing: 1px; display: block; }
.toolbar input { background: #0a1628; border: 1px solid #1a3a5c; color: #e0e8f0; border-radius: 4px; padding: 4px 7px; font-size: 11px; font-family: Arial; width: 150px; }
.btn { padding: 6px 14px; border-radius: 4px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; }
.btn-primary { background: #29B6D8; color: #0E2841; }
.btn-dl { background: #16a34a; color: #fff; }
.btn-svg { background: #7c3aed; color: #fff; }
.preview-area { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 20px; background: #06101e; }
.preview-wrap { width: 100%; max-width: 860px; }
#preview-svg { width: 100%; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); display: block; }
#preview-svg svg { width: 100% !important; height: auto !important; display: block; }
#preview-svg img { width: 100% !important; height: auto !important; display: block; }
.fields-panel { width: 260px; min-width: 260px; background: #0E2841; border-left: 1px solid #1a3a5c; overflow-y: auto; padding: 14px; }
.field-group { margin-bottom: 10px; }
.field-group label { display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 800; color: #7a9ab8; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.field-group input { width: 100%; background: #0a1628; border: 1px solid #1a3a5c; color: #e0e8f0; border-radius: 4px; padding: 5px 7px; font-size: 11px; font-family: Arial; }
.hint { font-size: 9px; color: #4a6a8a; margin-top: 3px; font-style: italic; }
#status { font-size: 10px; color: #29B6D8; padding: 3px 8px; background: rgba(41,182,216,0.1); border-radius: 3px; }
.fp-h3 { font-size: 9px; font-weight: 800; letter-spacing: 2px; color: #29B6D8; text-transform: uppercase; margin: 14px 0 8px; }
@media (max-width: 900px) {
  .layout { flex-direction: column; height: auto; overflow: visible; }
  .sidebar, .fields-panel { width: 100%; min-width: 0; max-height: 200px; border-right: none; border-left: none; border-bottom: 1px solid #1a3a5c; }
  .main { order: -1; overflow: visible; }
  .preview-area { overflow: visible; padding: 12px; }
  .preview-wrap { width: 100%; max-width: 100%; }
  .toolbar { gap: 10px; }
  .toolbar input { width: 130px; }
}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">ATLANTIC AVIATION — WATCH</div>
    <div class="header-sub">SOCIAL ALERT GENERATOR · 1200×630</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span id="status">Select a template</span>
    <button class="btn btn-primary" onclick="updatePreview()">↺ Refresh</button>
    <button class="btn btn-dl" onclick="downloadPNG()">⬇ PNG</button>
    <button class="btn btn-svg" onclick="downloadSVG()">⬇ SVG</button>
  </div>
</div>
<div class="layout">
  <div class="sidebar">
    <h3>Hazard Cards</h3>
    <button class="template-btn active" style="--accent:#FFD24A" onclick="selectTemplate('severe_tstorm',this)"><div class="dot"></div>Severe Weather</button>
    <button class="template-btn" style="--accent:#FF8A2A" onclick="selectTemplate('extreme_heat',this)"><div class="dot"></div>Extreme Heat</button>
    <button class="template-btn" style="--accent:#6FE3FF" onclick="selectTemplate('extreme_cold',this)"><div class="dot"></div>Extreme Cold</button>
    <button class="template-btn" style="--accent:#C9DDFF" onclick="selectTemplate('winter_weather',this)"><div class="dot"></div>Winter Weather</button>
    <button class="template-btn" style="--accent:#5CEFB8" onclick="selectTemplate('high_wind',this)"><div class="dot"></div>High Wind</button>
    <button class="template-btn" style="--accent:#3FB6FF" onclick="selectTemplate('flooding',this)"><div class="dot"></div>Flood / ERO</button>
    <button class="template-btn" style="--accent:#FF6B9E" onclick="selectTemplate('tropical',this)"><div class="dot"></div>Tropical</button>
    <button class="template-btn" style="--accent:#E8B15C" onclick="selectTemplate('air_quality',this)"><div class="dot"></div>Air Quality</button>
    <button class="template-btn" style="--accent:#FF6B2A" onclick="selectTemplate('fire_weather',this)"><div class="dot"></div>Fire Weather</button>
    <h3>NWS Severity</h3>
    <button class="template-btn" style="--accent:#FF4D4D" onclick="selectTemplate('nws_warning',this)"><div class="dot"></div>WARNING</button>
    <button class="template-btn" style="--accent:#FFB627" onclick="selectTemplate('nws_watch',this)"><div class="dot"></div>WATCH</button>
    <button class="template-btn" style="--accent:#F5E04A" onclick="selectTemplate('nws_advisory',this)"><div class="dot"></div>ADVISORY</button>
    <button class="template-btn" style="--accent:#7FB3FF" onclick="selectTemplate('nws_hazard',this)"><div class="dot"></div>OUTLOOK</button>
    <h3 style="margin-top:18px">Tips</h3>
    <div style="font-size:10px;color:#4a6a8a;line-height:1.5">Space or comma separated FBO codes per tier.<br><br>Upload a map image to fill the left panel.<br><br>Empty tiers are greyed out automatically.</div>
  </div>
  <div class="main">
    <div class="toolbar">
      <div><label>DATE</label><input type="text" id="f-date" placeholder="July 24, 2026" oninput="updatePreview()"></div>
      <div><label>TIMING</label><input type="text" id="f-timing" placeholder="This Afternoon – Tonight" oninput="updatePreview()"></div>
      <div><label>TIME TICKS (3, comma)</label><input type="text" id="f-ticks" placeholder="12 PM, 6 PM, 12 AM" oninput="updatePreview()" style="width:180px"></div>
      <div><label>SOURCE</label><input type="text" id="f-src" placeholder="Source: NOAA/NWS SPC..." oninput="updatePreview()" style="width:200px"></div>
    </div>
    <div class="preview-area"><div class="preview-wrap"><div id="preview-svg"></div></div></div>
  </div>
  <div class="fields-panel">
    <div id="fields-content"><div style="color:#4a6a8a;font-size:11px;margin-top:20px;text-align:center">Select a template</div></div>
  </div>
</div>

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function wrapText(s,w){const words=(s||'').split(' ');const lines=[];let cur='';words.forEach(word=>{if((cur+' '+word).trim().length>w){if(cur)lines.push(cur);cur=word;}else cur=(cur+' '+word).trim();});if(cur)lines.push(cur);return lines.length?lines:[''];}
function icon(name,x,y,size,stroke,sw,opacity){sw=sw||1.8;opacity=opacity||1;const s=size/24;return `<g transform="translate(${x},${y}) scale(${s})" fill="none" stroke="${stroke}" opacity="${opacity}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||''}</g>`;}

const T={
  severe_tstorm:{title:'SEVERE WEATHER ALERT',bg1:'#2B2409',bg2:'#0F0D04',accent:'#FFD24A',glow:'#B8860B',hero:'bolt',subtitle:'Severe Thunderstorms · Hail · Wind · Tornadoes',src:'Source: NOAA/NWS Storm Prediction Center — SPC Day 1 Categorical Outlook',hazards:[['tornado','Tornadoes'],['hail','Large Hail'],['wind','Damaging Wind'],['bolt','Lightning']],timing:'This Afternoon – Tonight',tl:['12 PM','6 PM','12 AM'],impacts:['Flying debris and downed trees possible in strongest storms','Hail large enough to dent aircraft and vehicles','Brief tornadoes possible with rotating storms','Localized power outages in hardest-hit areas'],chips:[{label:'HIGH · L5',bg:'#EC30F0',fg:'#000'},{label:'MDT · L4',bg:'#EA3232',fg:'#fff'},{label:'ENH · L3',bg:'#E97132',fg:'#000'},{label:'SLGT · L2',bg:'#FFC000',fg:'#000'},{label:'MRGL · L1',bg:'#196B24',fg:'#fff'},{label:'TSTM',bg:'#7dc4c4',fg:'#000'}],type:'hazard'},
  extreme_heat:{title:'EXTREME HEAT ALERT',bg1:'#3D1503',bg2:'#160701',accent:'#FF8A2A',glow:'#E25822',hero:'sun',subtitle:'Dangerous Heat · High Heat Index',src:'Source: NOAA/NWS — Excessive Heat product',hazards:[['sun','Extreme Heat'],['thermo_hi','High Heat Index'],['clock','Prolonged Exposure'],['shield','Heat Illness Risk']],timing:'Peak Heat Window',tl:['11 AM','3 PM','7 PM'],impacts:['Heat exhaustion and heat stroke risk during ramp work','Hot blacktop surfaces increase fatigue and burn risk','Mandatory water and shade breaks every hour','Ramp duty cycles shortened during peak hours'],chips:[{label:'EXTREME',bg:'#7B0D1E',fg:'#fff'},{label:'MAJOR',bg:'#EA3232',fg:'#fff'},{label:'MODERATE',bg:'#E97132',fg:'#000'},{label:'MINOR',bg:'#FFC000',fg:'#000'},{label:'LITTLE/NONE',bg:'#196B24',fg:'#fff'}],type:'hazard'},

  winter_weather:{title:'WINTER WEATHER ALERT',bg1:'#232B4A',bg2:'#0D101F',accent:'#C9DDFF',glow:'#7B96D8',hero:'snow',subtitle:'Snow · Ice · Freezing Rain',src:'Source: NOAA/NWS — Winter Storm product',hazards:[['ice','Freezing Rain'],['snow','Snow / Sleet'],['wave','Ice Accumulation'],['wind','Reduced Traction']],timing:'Precipitation Window',tl:['6 PM','12 AM','6 AM'],impacts:['Icy ramp, walkway, and roadway conditions','GSE traction and steering loss on untreated surfaces','Ladder and aerial lift use restricted during icing','Ice accumulation risk on tail and control surfaces'],chips:[{label:'WINTER STORM WARNING',bg:'#EA3232',fg:'#fff'},{label:'WINTER WX ADVISORY',bg:'#FFC000',fg:'#000'},{label:'MONITOR',bg:'#196B24',fg:'#fff'}],type:'hazard'},

let currentSlug='severe_tstorm',mapImageB64=null;

function buildSVG(slug){
  const t=T[slug]; if(!t) return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0a1628"/></svg>';
  const a=t.accent; const parts=[]; const A=s=>parts.push(s);
  const date=document.getElementById('f-date')?.value||'Month DD, YYYY';
  const timing=document.getElementById('f-timing')?.value||t.timing||'';

    const locLines=wrapText(locations,60); let ly=312;

      if(active) A(`<rect x="${x.toFixed(0)}" y="504" width="${cw.toFixed(0)}" height="34" rx="5" fill="none" stroke="#ffffff" stroke-width="2"/>`);

  A('</g></svg>');

}

function selectTemplate(slug,btn){
  currentSlug=slug; const t=T[slug]; if(!t) return;
  document.querySelectorAll('.template-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('f-timing').value=t.timing||'';
  document.getElementById('f-ticks').value=(t.tl||[]).join(', ');
  document.getElementById('f-src').value=t.src||'';
  const now=new Date();
  document.getElementById('f-date').value=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const fc=document.getElementById('fields-content');
  if(t.type==='hazard'){
    fc.innerHTML=`<div class="fp-h3">FBO Codes by Tier</div>`
      +(t.chips||[]).map((c,i)=>`<div class="field-group"><label><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c.bg};flex-shrink:0"></span>${c.label}</label><input type="text" id="f-chip-${i}" placeholder="e.g. TUL OKC DAL" oninput="updatePreview()"></div>`).join('')
      +`<div class="hint" style="margin-top:4px">Space or comma separated per tier</div>
      <div class="fp-h3" style="margin-top:14px">Map Image</div>
      <div class="field-group"><label>Upload PNG/JPG</label><input type="file" id="f-map" accept="image/*" onchange="loadMap(this)" style="background:none;border:none;color:#7a9ab8;padding:0;font-size:10px"></div>
      <button class="btn" style="background:#dc2626;color:#fff;font-size:10px;padding:4px 10px;margin-top:4px" onclick="clearMap()">✕ Clear map</button>`;
  } else {
    fc.innerHTML=`<div class="fp-h3">Alert Details</div>
      <div class="field-group"><label>Hazard Type</label><input type="text" id="f-hazard-type" placeholder="Flash Flood" oninput="updatePreview()"></div>
      <div class="field-group"><label>Affected Locations</label><input type="text" id="f-locations" placeholder="TUL · OKC · DAL · MKC" oninput="updatePreview()"></div>
      <div class="field-group"><label>Effective Period</label><input type="text" id="f-effective" placeholder="3:00 PM CDT through 10:00 PM" oninput="updatePreview()"></div>
      <div class="fp-h3" style="margin-top:14px">Map Image</div>
      <div class="field-group"><label>Upload PNG/JPG</label><input type="file" id="f-map" accept="image/*" onchange="loadMap(this)" style="background:none;border:none;color:#7a9ab8;padding:0;font-size:10px"></div>
      <button class="btn" style="background:#dc2626;color:#fff;font-size:10px;padding:4px 10px;margin-top:4px" onclick="clearMap()">✕ Clear map</button>`;
  }
  updatePreview();
}

function updatePreview(){
  const svg=buildSVG(currentSlug);
  const blob=new Blob([svg],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  document.getElementById('preview-svg').innerHTML=`<img src="${url}" style="width:100%;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,0.6)" onload="URL.revokeObjectURL('${url}')">`;
  document.getElementById('status').textContent=`${(T[currentSlug]||{}).title||''} · Ready`;
}

function loadMap(input){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{mapImageB64=e.target.result;updatePreview();};
  r.readAsDataURL(file);
}
function clearMap(){mapImageB64=null;const el=document.getElementById('f-map');if(el)el.value='';updatePreview();}
function downloadSVG(){
  const svg=buildSVG(currentSlug);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  a.download=`WATCH_${currentSlug}_${new Date().toISOString().slice(0,10)}.svg`;a.click();
}
function downloadPNG(){
  const svg=buildSVG(currentSlug);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=1200;c.height=630;
    c.getContext('2d').drawImage(img,0,0,1200,630);
    const a=document.createElement('a');a.href=c.toDataURL('image/png');
    a.download=`WATCH_${currentSlug}_${new Date().toISOString().slice(0,10)}.png`;a.click();
    document.getElementById('status').textContent='PNG downloaded!';
  };
  img.src=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
}

// postMessage from WATCH
window.addEventListener('message',function(e){
  const data=e.data; if(!data||data.type!=='WATCH_ALERT_DATA') return;
  const slug=data.slug||'severe_tstorm';
  const btn=document.querySelector(`.template-btn[onclick*="${slug}"]`);
  if(btn) selectTemplate(slug,btn);
  if(data.date&&document.getElementById('f-date')) document.getElementById('f-date').value=data.date;
  if(data.timing&&document.getElementById('f-timing')) document.getElementById('f-timing').value=data.timing;
  if(data.ticks&&document.getElementById('f-ticks')) document.getElementById('f-ticks').value=data.ticks;
  if(data.src&&document.getElementById('f-src')) document.getElementById('f-src').value=data.src;
  if(data.chips) data.chips.forEach(function(codes,i){const el=document.getElementById('f-chip-'+i);if(el)el.value=codes;});
  if(data.chipLabels&&T[slug]&&T[slug].chips) data.chipLabels.forEach(function(label,i){if(T[slug].chips[i])T[slug].chips[i].label=label;});
  if(data.hazardType&&document.getElementById('f-hazard-type')) document.getElementById('f-hazard-type').value=data.hazardType;
  if(data.locations&&document.getElementById('f-locations')) document.getElementById('f-locations').value=data.locations;
  if(data.effective&&document.getElementById('f-effective')) document.getElementById('f-effective').value=data.effective;
  setTimeout(updatePreview,100);
});

// Init
selectTemplate('severe_tstorm',document.querySelector('.template-btn'));

// Auto-populate from WATCH URL params
(function() {
  var p = new URLSearchParams(window.location.search);
  if (!p.has('slug')) return;

  var slug = p.get('slug') || 'severe_tstorm';
  var btn = document.querySelector(`.template-btn[onclick*="${slug}"]`);
  if (btn) selectTemplate(slug, btn);

  if (p.get('date')) document.getElementById('f-date').value = p.get('date');
  if (p.get('timing')) document.getElementById('f-timing').value = p.get('timing');
  if (p.get('src')) document.getElementById('f-src').value = p.get('src');

  // Map chip param keys to template chip slots
  var chipKeys = {
    severe_tstorm: ['c0','c1','c2','c3','c4','c5'],
    extreme_heat:  ['h0','h1','h2','h3','h4'],
    air_quality:   ['a0','a1','a2','a3','a4','a5'],
    high_wind:     ['w0','w1','w2'],
    flooding:      ['f0','f1','f2','f3'],
    extreme_cold:  ['w0','w1','w2'],
    winter_weather:['w0','w1','w2'],
    tropical:      ['w0','w1','w2'],
    fire_weather:  ['c0','c1','c2','c3','c4'],
  };
  var keys = chipKeys[slug] || [];
  keys.forEach(function(key, i) {
    var el = document.getElementById('f-chip-' + i);
    if (el && p.has(key)) el.value = p.get(key);
  });

  // Severity card fields
  if (p.get('hazardType')) { var el=document.getElementById('f-hazard-type'); if(el) el.value=p.get('hazardType'); }
  if (p.get('locations'))  { var el=document.getElementById('f-locations');  if(el) el.value=p.get('locations'); }
  if (p.get('effective'))  { var el=document.getElementById('f-effective');  if(el) el.value=p.get('effective'); }

  setTimeout(updatePreview, 150);
})();
</script>
