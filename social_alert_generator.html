<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WATCH alert cards</title>
<style>
/* Atlantic Aviation brand standards 2026 V1.01: Atlantic Blue 005293, Atlantic Green 5E9CAE, Twilight 003B5C,
   Merlot 762839, Dark Jade 3D727D, Mellow F1CC68, Tarmac 4C5451, Warm Mountain 8C8776, Cool Slate DFE1E1.
   Internal-use alternate fonts: Georgia for headlines, Source Sans Pro for body. Sentence case, never all caps. */
:root{--blue:#005293;--green:#5E9CAE;--twilight:#003B5C;--merlot:#762839;--jade:#3D727D;--mellow:#F1CC68;--tarmac:#4C5451;--warm:#8C8776;--slate:#DFE1E1;
  --head:Georgia,"Times New Roman",serif;--body:"Source Sans 3","Source Sans Pro","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{max-width:100vw;overflow-x:hidden}
body{font-family:var(--body);background:#F2F4F4;color:var(--twilight);font-size:16px;line-height:1.35}
.top{background:var(--twilight);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--green)}
.brand{display:flex;align-items:center;min-height:40px}
.brand img{height:36px;width:auto;display:block}
.brand .wm{font-family:var(--head);font-size:24px;letter-spacing:.2px}
.top .ttl{margin-left:auto;font-family:var(--head);font-size:20px}
@media (max-width:480px){.brand .wm{font-size:20px}.top .ttl{font-size:16px}.top{padding:10px 12px;gap:8px}}
main{max-width:1100px;margin:0 auto;padding:14px 12px 40px}
.panel{background:#fff;border:1px solid var(--slate);border-radius:10px;padding:14px;margin-bottom:14px}
.status{font-size:14px;color:var(--tarmac);margin-bottom:10px}
.status.warn{color:var(--merlot);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1 1 30%;min-width:96px;padding:10px 8px;border-radius:8px;border:1px solid var(--slate);background:#fff;color:var(--twilight);font:600 15px var(--body);cursor:pointer}
.tab[aria-selected=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.ctl{margin-bottom:12px}
.ctl label.lbl{display:block;font-size:13px;font-weight:600;color:var(--tarmac);margin-bottom:5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 22%;min-width:84px;padding:9px 6px;border-radius:8px;border:1px solid var(--slate);background:#fff;color:var(--twilight);font:600 14px var(--body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--twilight);color:#fff;border-color:var(--twilight)}
select,input[type=text]{width:100%;padding:10px;border:1px solid var(--warm);border-radius:8px;font:16px var(--body);color:var(--twilight);background:#fff}
.chk{display:flex;gap:14px;flex-wrap:wrap}
.chk label{display:flex;align-items:center;gap:6px;font-size:15px}
.chk input{width:20px;height:20px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{padding:11px 16px;border-radius:8px;border:0;font:700 15px var(--body);cursor:pointer;background:var(--blue);color:#fff}
.btn.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.5}
.note{font-size:13px;color:var(--tarmac);margin-top:8px}
.card{background:#fff;border:1px solid var(--slate);border-radius:10px;margin-bottom:14px;overflow:hidden}
.card .svgwrap svg{display:block;width:100%;height:auto}
.card figcaption{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:14px;font-weight:600;border-top:1px solid var(--slate)}
.card figcaption span{flex:1}
.card figcaption button{padding:7px 12px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue);font:700 13px var(--body);cursor:pointer}
.empty{background:#fff;border:1px dashed var(--warm);border-radius:10px;padding:22px;text-align:center;color:var(--tarmac)}
.grid{display:block}
@media (min-width:900px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .card{margin-bottom:0}}
@page{size:letter landscape;margin:.5in}
@media print{
  body{background:#fff}
  .top,.panel,.card figcaption,.note,.status{display:none!important}
  main{padding:0;max-width:none}
  .grid{display:block}
  .card{border:0;border-radius:0;margin:0;page-break-after:always;break-after:page}
  .card:last-child{page-break-after:auto;break-after:auto}
  .card .svgwrap svg{width:10in;height:5.25in}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img id="hdrLogo" alt="Atlantic Aviation" hidden><span class="wm" id="hdrText">Atlantic Aviation</span></div>
  <div class="ttl">WATCH alert cards</div>
</header>
<main>
  <section class="panel">
    <div class="status" id="status">Waiting for live data from WATCH...</div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="hazard" aria-selected="true">Hazard cards</button>
      <button class="tab" role="tab" data-tab="area" aria-selected="false">Area sheets</button>
      <button class="tab" role="tab" data-tab="loc" aria-selected="false">Location sheets</button>
    </div>

    <div class="ctl" id="ctl-hazard">
      <label class="lbl">Time period</label>
      <div class="seg" id="seg-p"></div>
      <label class="lbl" style="margin-top:10px">Show these levels</label>
      <div class="chk" id="chk-tier">
        <label><input type="checkbox" value="3" checked> Warning</label>
        <label><input type="checkbox" value="2" checked> Advisory</label>
        <label><input type="checkbox" value="1"> Monitor</label>
      </div>
      <div class="note">One card per hazard and level, listing the sites affected. Post each card at the sites it names.</div>
    </div>

    <div class="ctl" id="ctl-area" hidden>
      <label class="lbl" for="selArea">Area</label>
      <select id="selArea"></select>
      <label class="lbl" style="margin-top:10px">Sheet</label>
      <div class="seg" id="seg-av"></div>
    </div>

    <div class="ctl" id="ctl-loc" hidden>
      <label class="lbl" for="inLoc">Location codes</label>
      <input type="text" id="inLoc" placeholder="For example: MSY or MSY, DAL, HOU" autocapitalize="characters" autocomplete="off" list="dlLoc">
      <datalist id="dlLoc"></datalist>
      <label class="lbl" style="margin-top:10px">Sheet</label>
      <div class="seg" id="seg-lv"></div>
    </div>

    <div class="acts">
      <button class="btn" id="btnPrint">Print</button>
      <button class="btn alt" id="btnZip">Download all (PNG)</button>
    </div>
    <div class="note" id="foot-note">Periods follow the Briefing: next 24 hours is today and tonight, then the next two calendar days.</div>
  </section>
  <section id="gallery" class="grid"></section>
</main>

<script>
(function(){
'use strict';
var W = 1200, H = 630;
var C = {blue:'#005293', green:'#5E9CAE', twilight:'#003B5C', merlot:'#762839', jade:'#3D727D', mellow:'#F1CC68', tarmac:'#4C5451', warm:'#8C8776', slate:'#DFE1E1', white:'#FFFFFF', wash:'#F2F4F4'};
var HEAD = "Georgia,'Times New Roman',serif";
var BODY = "'Source Sans 3','Source Sans Pro','Segoe UI',Roboto,Arial,sans-serif";

var TIER = {
  3: {word:'warning',  Word:'Warning',  fill:C.merlot, ink:'#FFFFFF', means:'Act now. Stop outdoor work as the hazard arrives and follow your warning procedures.'},
  2: {word:'advisory', Word:'Advisory', fill:C.mellow, ink:C.twilight, means:'Get ready. Brief your team and prepare the ramp.'},
  1: {word:'monitor',  Word:'Monitor',  fill:C.jade,   ink:'#FFFFFF', means:'Stay aware. No change to operations yet. Keep watching the forecast.'}
};
var KIND_ORDER = ['thunder','wind','tropical','flood','winter','coastal','heat','cold','fire','aqi','other'];
var KIND = {
  thunder:{label:'Thunderstorms and lightning', short:'Thunderstorms', map:/^spc$/},
  wind:   {label:'High winds',                  short:'High wind',     map:/^wind/},
  tropical:{label:'Tropical weather',           short:'Tropical',      map:/^(tropical|nhc)/},
  flood:  {label:'Heavy rain and flooding',     short:'Flooding',      map:/^ero$/},
  winter: {label:'Winter weather',              short:'Winter weather',map:/^winter$/},
  coastal:{label:'Coastal flooding',            short:'Coastal flood', map:null},
  heat:   {label:'Extreme heat',                short:'Heat',          map:/^heat/},
  cold:   {label:'Extreme cold',                short:'Cold',          map:/^cold/},
  fire:   {label:'Fire weather',                short:'Fire weather',  map:/^fire$/},
  aqi:    {label:'Poor air quality',            short:'Air quality',   map:/^aqi/},
  other:  {label:'Other weather alerts',        short:'Other alerts',  map:null}
};
var FALLBACK_ACT = {
  tropical:{adv:['Review your site tropical plan and brief the team on expected timing.','Secure or relocate aircraft, GSE and loose items before conditions worsen.','Confirm shelter, fuel and power plans.'],
            warn:['Follow your site tropical plan now. Stop non-essential outdoor work.','Secure or relocate aircraft, GSE and loose items.','Confirm crew shelter, fuel and power plans, and check in with your manager.']},
  coastal:{adv:['Brief the team on expected tide and surge timing.','Move equipment and vehicles away from low or flood-prone areas.'],
           warn:['Move equipment and vehicles to high ground now.','Stop work in flooded or flood-prone areas.','Check in with your manager before resuming.']},
  other:  {adv:['Read the full alert and brief the team.','Follow your site procedure for this hazard.'],
           warn:['Read the full alert and brief the team now.','Follow your site procedure for this hazard and check in with your manager.']}
};
var MONITOR_ACT = ['Review the forecast at the start of each shift.','Tell your team what to watch for and when.','Be ready to move to advisory actions if conditions change.'];

var DATA = null, LOGO = null, CUR = [];
var S = {tab:'hazard', p:0, tiers:{3:true,2:true,1:false}, area:'__all', av:'ov', locs:'', lv:'ov'};

/* ---------- small helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var _cx = document.createElement('canvas').getContext('2d');
function mw(t, size, weight, fam){ _cx.font = weight + ' ' + size + 'px ' + fam; return _cx.measureText(t).width; }
function wrap(text, size, weight, fam, maxW, maxLines){
  var words = String(text || '').replace(/\s+/g,' ').trim().split(' '), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var t = cur ? cur + ' ' + words[i] : words[i];
    if (mw(t, size, weight, fam) <= maxW || !cur) cur = t; else { lines.push(cur); cur = words[i]; }
  }
  if (cur) lines.push(cur);
  if (maxLines && lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    var last = lines[maxLines - 1];
    while (last.length > 1 && mw(last + '…', size, weight, fam) > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last.replace(/[ ,;:.]+$/, '') + '…';
  }
  return lines;
}
function clip1(text, size, weight, fam, maxW){ return wrap(text, size, weight, fam, maxW, 1)[0] || ''; }
function T(x, y, text, o){
  o = o || {};
  return '<text x="' + x + '" y="' + y + '" font-family="' + (o.fam || BODY) + '" font-size="' + (o.size || 16) + '" font-weight="' + (o.weight || 400) + '" fill="' + (o.fill || C.twilight) + '"'
    + (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') + (o.italic ? ' font-style="italic"' : '') + (o.op ? ' fill-opacity="' + o.op + '"' : '') + '>' + esc(text) + '</text>';
}
function R(x, y, w, h, o){
  o = o || {};
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (o.rx || 0) + '" fill="' + (o.fill || 'none') + '"'
    + (o.stroke ? ' stroke="' + o.stroke + '" stroke-width="' + (o.sw || 1) + '"' : '') + (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') + '/>';
}
function chip(x, y, text, tier, o){
  o = o || {}; var t = TIER[tier], size = o.size || 14, h = o.h || 26;
  var label = text;
  var w = Math.ceil(mw(label, size, 700, BODY)) + 20;
  if (o.maxW && w > o.maxW) { label = clip1(label, size, 700, BODY, o.maxW - 20); w = Math.ceil(mw(label, size, 700, BODY)) + 20; }
  var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (h / 2) + '" fill="' + t.fill + '"' + (tier === 2 ? ' stroke="' + C.tarmac + '" stroke-width="1"' : '') + '/>'
        + T(x + 10, y + h / 2 + size * .36, label, {size:size, weight:700, fill:t.ink});
  return {svg:s, w:w};
}
function dateLabel(d){ return d; }

/* ---------- brand frame ---------- */
function frame(inner, sub){
  var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
  s += R(0, 0, W, H, {fill:C.white});
  s += R(0, 0, W, 92, {fill:C.twilight}) + R(0, 92, W, 5, {fill:C.green});
  if (LOGO) {
    var lh = 46, lw = Math.round(lh * LOGO.w / LOGO.h);
    if (lw > 260) { lw = 260; lh = Math.round(lw * LOGO.h / LOGO.w); }
    s += '<image x="40" y="' + (46 - lh / 2) + '" width="' + lw + '" height="' + lh + '" href="' + LOGO.url + '" preserveAspectRatio="xMidYMid meet"/>';
  } else s += T(40, 58, 'Atlantic Aviation', {fam:HEAD, size:32, fill:'#fff'});
  s += T(1160, 42, 'Weather alert', {fam:HEAD, size:24, fill:'#fff', anchor:'end'});
  s += T(1160, 68, (DATA && DATA.issuedLabel ? 'Issued ' + DATA.issuedLabel : '') + (sub ? '  ·  ' + sub : ''), {size:15, fill:'#fff', anchor:'end', op:.85});
  s += inner;
  s += R(0, 560, W, 70, {fill:C.wash}) + R(0, 560, W, 2, {fill:C.slate});
  s += T(40, 584, 'Safety is paramount. Employee safety comes before operations, and anyone can stop work if something feels unsafe.', {size:14, weight:600, fill:C.twilight});
  var disc = wrap('For internal awareness only. Based on information available at the time of issue. Does not replace official NWS watches, warnings and advisories. Check weather.gov for the latest. Source: NOAA/NWS data through WATCH.', 11, 400, BODY, 1120, 2);
  disc.forEach(function(l, i){ s += T(40, 604 + i * 14, l, {size:11, fill:C.tarmac}); });
  return s + '</svg>';
}

/* ---------- data access ---------- */
function haz(code, p){
  var s = DATA.sites[code]; var h = (s && s.h && s.h[p]) ? s.h[p].slice() : [];
  h.sort(function(a, b){ return b.t - a.t || KIND_ORDER.indexOf(a.k) - KIND_ORDER.indexOf(b.k); });
  return h;
}
function gapOf(code, p){ var s = DATA.sites[code] || {}; return p === 0 ? !!s.gap0 : !!s.gapF; }
function siteName(code){ var s = DATA.sites[code] || {}; return s.city ? s.city + (s.state ? ', ' + s.state : '') : ''; }
function periodName(p){ return DATA.periods[p].name; }
function periodDate(p){ return DATA.periods[p].sub; }
function actionsFor(kind, tier){
  var a = (DATA.actions && DATA.actions[kind]) || FALLBACK_ACT[kind] || FALLBACK_ACT.other;
  var list = tier >= 3 ? (a.warn && a.warn.length ? a.warn : a.adv) : tier === 2 ? a.adv : MONITOR_ACT;
  return (list || MONITOR_ACT).map(shortAct);
}
function shortAct(t){
  t = String(t || '').replace(/\s+/g, ' ').trim();
  var m = t.match(/^(.{40,150}?[.!?])(\s|$)/);
  return m ? m[1] : (t.length > 150 ? t.slice(0, 147).replace(/[ ,;:]+$/, '') + '…' : t);
}
function pickMap(kind, p){
  if (p !== 0 || !DATA.maps || !KIND[kind].map) return null;
  var re = KIND[kind].map, best = null;
  DATA.maps.forEach(function(m){ if (re.test(m.key) && (!best || (best.regional && !m.regional))) best = m; });
  return best;
}
function areaOf(code){ return (DATA.sites[code] && DATA.sites[code].area) || 'Corporate'; }

/* ---------- card: hazard (posted at affected sites) ---------- */
function cardHazard(sp){
  var t = TIER[sp.tier], k = KIND[sp.kind], p = sp.p, s = '';
  var map = pickMap(sp.kind, p);
  // headline
  s += T(40, 152, k.label, {fam:HEAD, size:46, fill:C.twilight});
  var pw = Math.max(170, Math.ceil(mw(t.Word, 28, 700, BODY)) + 44);
  s += R(1160 - pw, 112, pw, 48, {fill:t.fill, rx:24, stroke:sp.tier === 2 ? C.tarmac : '', sw:1});
  s += T(1160 - pw / 2, 146, t.Word, {size:28, weight:700, fill:t.ink, anchor:'middle'});
  s += T(40, 186, t.means, {size:20, fill:C.tarmac});
  var when = periodName(p) + '  ·  ' + periodDate(p) + (sp.until ? '  ·  Alerts run until ' + sp.until : '');
  s += T(40, 214, 'When: ' + when, {size:18, weight:600, fill:C.blue});
  s += R(40, 226, 1120, 1, {fill:C.slate});
  // columns
  var cols = map ? {mx:40, mw:330, sx:394, sw:300, ax:726, aw:434} : {sx:40, sw:430, ax:510, aw:650};
  if (map) {
    s += '<defs><clipPath id="mc"><rect x="40" y="240" width="330" height="270" rx="8"/></clipPath></defs>';
    s += R(40, 240, 330, 270, {fill:C.wash});
    s += '<image x="40" y="240" width="330" height="270" preserveAspectRatio="xMidYMid slice" clip-path="url(#mc)" href="' + map.dataUrl + '"/>';
    s += R(40, 240, 330, 270, {rx:8, stroke:C.slate, sw:2});
    s += T(40, 530, 'Map from WATCH at issue time', {size:12, fill:C.tarmac});
  }
  // sites grouped by area
  s += T(cols.sx, 262, 'Affected sites (' + sp.codes.length + ')', {fam:HEAD, size:24, fill:C.twilight});
  var byArea = {}; sp.codes.forEach(function(c){ var a = areaOf(c); (byArea[a] = byArea[a] || []).push(c); });
  var areas = Object.keys(byArea).sort(); var y = 290, maxY = 548, shown = 0, total = sp.codes.length;
  var perLine = total <= 9;   // few sites: one per line with the city, easier to read from a distance
  for (var ai = 0; ai < areas.length; ai++) {
    var a = areas[ai], codes = byArea[a].sort();
    var lines = perLine ? codes : wrap(codes.join('  '), 17, 700, BODY, cols.sw, 6);
    var lh2 = perLine ? 24 : 21, need = 18 + lines.length * lh2 + 8;
    if (y + need > maxY) break;
    s += T(cols.sx, y, a === 'Corporate' ? 'Corporate' : a + ' area', {size:14, weight:600, fill:C.jade});
    lines.forEach(function(l, i){
      if (perLine) s += T(cols.sx, y + 22 + i * lh2, l, {size:18, weight:700, fill:C.twilight}) + T(cols.sx + 56, y + 22 + i * lh2, clip1(siteName(l), 16, 400, BODY, cols.sw - 60), {size:16, fill:C.tarmac});
      else s += T(cols.sx, y + 20 + i * 21, l, {size:17, weight:700, fill:C.twilight});
    });
    y += need; shown += codes.length;
  }
  if (shown < total) s += T(cols.sx, 556, '+ more sites. See the area sheets.', {size:13, fill:C.tarmac, italic:true});
  // divider and actions
  s += R(cols.ax - 16, 240, 1, 300, {fill:C.slate});
  s += T(cols.ax, 262, 'What to do', {fam:HEAD, size:24, fill:C.twilight});
  var acts = actionsFor(sp.kind, sp.tier).slice(0, 4), ay = 290;
  var aSize = map ? 16 : 18, lh = map ? 20 : 23;
  for (var i = 0; i < acts.length; i++) {
    var ls = wrap(acts[i], aSize, 400, BODY, cols.aw - 36, map ? 3 : 3);
    if (ay + ls.length * lh > 556) break;
    s += '<circle cx="' + (cols.ax + 11) + '" cy="' + (ay - 5) + '" r="11" fill="' + C.blue + '"/>' + T(cols.ax + 11, ay, String(i + 1), {size:14, weight:700, fill:'#fff', anchor:'middle'});
    ls.forEach(function(l, j){ s += T(cols.ax + 32, ay + j * lh, l, {size:aSize, fill:C.twilight}); });
    ay += ls.length * lh + 12;
  }
  return {svg:frame(s, ''), name:'WATCH_' + sp.kind + '_' + t.word + '_' + ['24h','48h','72h'][p], title:k.label + ': ' + t.word + ' (' + periodName(p).toLowerCase() + ')'};
}

/* ---------- legend (used on sheets) ---------- */
function legend(x, y){
  var s = '', cx = x;
  [3, 2, 1].forEach(function(t){
    var c = chip(cx, y, TIER[t].Word + ': ' + (t === 3 ? 'act now' : t === 2 ? 'get ready' : 'stay aware'), t, {size:13, h:24});
    s += c.svg; cx += c.w + 8;
  });
  return s;
}
function hazChips(list, x, y, maxW, maxN){
  var s = '', n = 0, pitch = 26;
  for (var i = 0; i < list.length && n < maxN; i++) {
    var h = list[i], c = chip(x, y + n * pitch, KIND[h.k].short + ': ' + TIER[h.t].word, h.t, {size:13, h:22, maxW:maxW});
    s += c.svg; n++;
  }
  if (list.length > n) { var lastW = mw(KIND[list[n - 1].k].short + ': ' + TIER[list[n - 1].t].word, 13, 700, BODY) + 30; s += T(x + lastW + 4, y + (n - 1) * pitch + 16, '+ ' + (list.length - n) + ' more', {size:12, fill:C.tarmac, italic:true}); }
  return s;
}

/* ---------- card: area, 3-day overview ---------- */
function cardAreaOverview(area, codes, page, pages){
  var s = '', title = area === 'Corporate' ? 'Corporate' : area + ' area';
  s += T(40, 142, title, {fam:HEAD, size:38, fill:C.twilight});
  s += T(40, 168, '3-day weather outlook  ·  ' + codes.length + ' location' + (codes.length === 1 ? '' : 's') + (pages > 1 ? '  ·  Page ' + page + ' of ' + pages : ''), {size:17, fill:C.tarmac});
  s += legend(560, 124);
  var x0 = 40, sw = 230, pw = 296, y0 = 178;
  s += R(40, y0, 1120, 36, {fill:C.twilight, rx:6});
  s += T(x0 + 12, y0 + 24, 'Location', {size:15, weight:700, fill:'#fff'});
  for (var p = 0; p < 3; p++) {
    var px = 40 + sw + p * pw;
    s += T(px + 10, y0 + 16, periodName(p), {size:15, weight:700, fill:'#fff'});
    s += T(px + 10, y0 + 30, periodDate(p), {size:12, fill:'#fff', op:.85});
  }
  var rh = 56, ry = y0 + 40;
  codes.forEach(function(code, i){
    var y = ry + i * rh;
    s += R(40, y, 1120, rh - 2, {fill:i % 2 ? C.wash : '#fff'});

/* ---------- build card lists ---------- */
function paginate(codes, heightFn, maxH){
  var pages = [], cur = [], h = 0;
  codes.forEach(function(c){
    var rh = heightFn(c);
    if (cur.length && h + rh > maxH) { pages.push(cur); cur = []; h = 0; }
    cur.push(c); h += rh;
  });
  if (cur.length) pages.push(cur);
  return pages;
}
function areaCards(area, view){
  var codes = (DATA.areas[area] || []).slice().sort(); var out = [];
  if (!codes.length) return out;
  if (view === 'ov') {
    paginate(codes, function(){ return 56; }, 6 * 56).forEach(function(pg, i, all){ out.push(cardAreaOverview(area, pg, i + 1, all.length)); });
  } else {
    var p = Number(view);
    paginate(codes, function(c){ return areaRowHeight(c, p); }, 326).forEach(function(pg, i, all){ out.push(cardAreaDetail(area, pg, p, i + 1, all.length)); });
  }
  return out;
}
function hazardSpecs(p){
  var map = {};
  Object.keys(DATA.sites).forEach(function(code){
    haz(code, p).forEach(function(h){
      var key = h.k + '|' + h.t; (map[key] = map[key] || {kind:h.k, tier:h.t, p:p, codes:[], untils:{}});
      if (map[key].codes.indexOf(code) < 0) map[key].codes.push(code);
      if (h.u) map[key].untils[h.u] = (map[key].untils[h.u] || 0) + 1;
    });
  });
  var list = Object.keys(map).map(function(k){ return map[k]; }).filter(function(sp){ return S.tiers[sp.tier]; });
  list.forEach(function(sp){
    sp.codes.sort();
    var best = null, bn = 0; Object.keys(sp.untils).forEach(function(u){ if (sp.untils[u] > bn) { bn = sp.untils[u]; best = u; } });
    sp.until = (best && Object.keys(sp.untils).length === 1) ? best : '';
  });
  list.sort(function(a, b){ return b.tier - a.tier || KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind); });
  return list;
}
function parseCodes(str){
  return String(str || '').toUpperCase().split(/[\s,;]+/).filter(Boolean).filter(function(c, i, a){ return a.indexOf(c) === i; });
}
function build(){
  CUR = [];
  if (!DATA) return;
  if (S.tab === 'hazard') {
    hazardSpecs(S.p).forEach(function(sp){ CUR.push(cardHazard(sp)); });
  } else if (S.tab === 'area') {
    var areas = S.area === '__all' ? Object.keys(DATA.areas).filter(function(a){ return DATA.areas[a].length; }) : [S.area];
    areas.forEach(function(a){ areaCards(a, S.av).forEach(function(c){ CUR.push(c); }); });
  } else {
    parseCodes(S.locs).forEach(function(code){
      if (!DATA.sites[code]) return;
      if (S.lv === 'ov') CUR.push(cardLocOverview(code)); else CUR.push(cardLocDetail(code, Number(S.lv)));
    });
  }
}
function render(){
  var g = document.getElementById('gallery');
  if (!DATA) { g.innerHTML = ''; return; }
  build();
  var msg = '';
  if (!CUR.length) {
    if (S.tab === 'hazard') msg = 'No hazards at the selected levels for ' + periodName(S.p).toLowerCase() + '. Turn on Monitor to see awareness-only items.';
    else if (S.tab === 'loc') msg = parseCodes(S.locs).length ? 'No matching location codes. Check the spelling.' : 'Type one or more location codes to build their sheets.';
    else msg = 'No locations found for this area.';
    g.innerHTML = '<div class="empty">' + esc(msg) + '</div>';
  } else {
    g.innerHTML = CUR.map(function(c, i){
      return '<figure class="card"><div class="svgwrap">' + c.svg + '</div><figcaption><span>' + esc(c.title) + '</span><button data-i="' + i + '">Download PNG</button></figcaption></figure>';
    }).join('');
  }
  document.getElementById('btnPrint').disabled = !CUR.length;
  document.getElementById('btnZip').disabled = !CUR.length;
  document.getElementById('btnZip').textContent = CUR.length > 1 ? 'Download all (' + CUR.length + ' PNG)' : 'Download PNG';
}

/* ---------- PNG and ZIP ---------- */
function svgToPng(svg){
  return new Promise(function(res, rej){
    var img = new Image();
    var url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml;charset=utf-8'}));
    img.onload = function(){
      var cv = document.createElement('canvas'); cv.width = W * 2; cv.height = H * 2;
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); cv.toBlob(function(b){ b ? res(b) : rej(new Error('png')); }, 'image/png');
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('render')); };
    img.src = url;
  });
}
function saveBlob(blob, name){
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
var CRC = (function(){ var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ var c = 0xFFFFFFFF; for (var i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  var enc = new TextEncoder(), parts = [], central = [], off = 0;
  files.forEach(function(f){
    var nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    var lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    var ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + sz;
  });
  var csz = central.reduce(function(a, b){ return a + b.length; }, 0);
  var end = new DataView(new ArrayBuffer(22)); end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csz, true); end.setUint32(16, off, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), {type:'application/zip'});
}
async function downloadAll(btn){
  if (!CUR.length) return;
  var label = btn.textContent; btn.disabled = true;
  try {
    if (CUR.length === 1) { saveBlob(await svgToPng(CUR[0].svg), CUR[0].name + '.png'); return; }
    var files = [], used = {};
    for (var i = 0; i < CUR.length; i++) {
      btn.textContent = 'Rendering ' + (i + 1) + ' of ' + CUR.length + '...';
      var nm = CUR[i].name; if (used[nm]) nm += '_' + (++used[nm]); else used[nm] = 1;
      var b = await svgToPng(CUR[i].svg); files.push({name:nm + '.png', data:new Uint8Array(await b.arrayBuffer())});
    }
    saveBlob(zipStore(files), 'WATCH_alert_cards.zip');
  } catch (e) { alert('Could not render the cards. Try fewer cards at a time.'); }
  finally { btn.textContent = label; btn.disabled = false; }
}

/* ---------- logo (approved artwork only) ---------- */
function loadLogo(){
  var names = ['atlantic-logo-white.svg', 'atlantic-logo-white.png'], i = 0;
  function tryNext(){
    if (i >= names.length) return;
    var nm = names[i++];
    fetch(nm).then(function(r){ if (!r.ok) throw 0; return r.blob(); }).then(function(b){
      return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); });
    }).then(function(url){
      var im = new Image(); im.onload = function(){
        LOGO = {url:url, w:im.naturalWidth || 400, h:im.naturalHeight || 100};
        var h = document.getElementById('hdrLogo'); h.src = url; h.hidden = false; document.getElementById('hdrText').hidden = true; render();
      }; im.onerror = tryNext; im.src = url;
    }).catch(tryNext);
  }
  tryNext();
}

/* ---------- data in ---------- */
function setData(p, source){
  if (!p || !p.sites || !p.periods) return;
  DATA = p;
  var st = document.getElementById('status'), ageMin = p.issuedAt ? Math.round((Date.now() - new Date(p.issuedAt).getTime()) / 60000) : 0;
  var n = Object.keys(p.sites).length;
  st.className = 'status' + (ageMin > 120 ? ' warn' : '');
  st.textContent = n + ' locations from WATCH, issued ' + (p.issuedLabel || '') + (ageMin > 120 ? '. This data is ' + Math.round(ageMin / 60) + ' hours old. Reopen from WATCH for the latest.' : '.')
    + (source === 'saved' ? ' (Saved copy: hazard maps are not included.)' : '');
  var sel = document.getElementById('selArea');
  sel.innerHTML = '<option value="__all">All areas</option>' + Object.keys(p.areas).filter(function(a){ return p.areas[a].length; }).map(function(a){ return '<option value="' + esc(a) + '">' + esc(a === 'Corporate' ? 'Corporate' : a + ' area') + '</option>'; }).join('');
  document.getElementById('dlLoc').innerHTML = Object.keys(p.sites).sort().map(function(c){ return '<option value="' + esc(c) + '">' + esc(siteName(c)) + '</option>'; }).join('');
  segs();
  render();
}
function segs(){
  function seg(id, items, cur, cb){
    var el = document.getElementById(id);
    el.innerHTML = items.map(function(it){ return '<button type="button" data-v="' + it[0] + '" aria-pressed="' + (String(cur) === String(it[0])) + '">' + esc(it[1]) + '</button>'; }).join('');
    el.onclick = function(e){ var b = e.target.closest('button'); if (!b) return; cb(b.dataset.v); segs(); render(); };
  }
  var per = DATA ? [0, 1, 2].map(function(p){ return [p, periodName(p)]; }) : [];
  seg('seg-p', per, S.p, function(v){ S.p = Number(v); });
  var vw = [['ov', '3-day overview']].concat(per);
  seg('seg-av', vw, S.av, function(v){ S.av = v; });
  seg('seg-lv', vw, S.lv, function(v){ S.lv = v; });
}

    document.getElementById('ctl-hazard').hidden = S.tab !== 'hazard';

    var d = e.data; if (d && d.type === 'WATCH_CARDS' && d.payload) setData(d.payload, 'live');
  });
  // Ask the WATCH window that opened this page for the live data (it answers when its data is ready).
  var tries = 0, ping = setInterval(function(){
    if (DATA && DATA.__live) { clearInterval(ping); return; }
    if (window.opener && !window.opener.closed && tries < 120) { try { window.opener.postMessage({type:'WATCH_CARDS_READY'}, location.origin); } catch (x) {} tries++; }
    else { clearInterval(ping); }
  }, 1000);
  var _set = setData; setData = function(p, s){ if (s === 'live') p.__live = true; _set(p, s); };
  // Fallback: the copy WATCH saved when it opened this page.
  setTimeout(function(){
    if (DATA) return;
    try { var raw = localStorage.getItem('watch_cards_payload'); if (raw) setData(JSON.parse(raw), 'saved'); } catch (x) {}
    if (!DATA) { var st = document.getElementById('status'); st.className = 'status warn'; st.textContent = 'No data yet. Open this page from the Alert Card button in WATCH.'; }
  }, 4000);
  window.__loadPayload = function(p){ setData(p, 'live'); };
}
init();
})();
</script>
